<html>
	<head>
		<title>Bienvenido</title>
	</head>
	<body>
		
	<form th:action="@{/login}" method="POST" th:object="${usuario}">
		<h1>Bienvenido!</h1>
		<h3>Identificate</h3>
		<label for="nick">Usuario: </label>
		<input type="text" name="nick" th:field="*{nick}">
		<br>
		<label for="pass">Contraseña: </label>
		<input type="password" name="pass" th:field="*{pass}">
		<br>
		<p th:if="*{autenticado != true && contador > 0} " th:text="|Usuario o contraseña incorrectos|"></p>
		<br>
		<button type="submit">Enviar</button>
	</form>
	</body>
</html>
